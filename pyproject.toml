[project]
name = "mad-cli"
version = "0.1.0"
description = "Generate video with LTX-Video on your own RunPod account — no dashboard clicks, no run-time caps."
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
]

[project.scripts]
mad = "mad_cli.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
